[package]
name = "lucky-number"
version = "1.0.0"
description = "幸运号码 · 双色球 / 大乐透模拟选号客户端"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "lucky_number_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
